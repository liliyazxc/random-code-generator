<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩票随机码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            align-items: stretch;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 30px;
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #0369a1;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .code-display {
            background: linear-gradient(145deg, #075985, #0369a1);
            border-radius: 12px;
            padding: 20px 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .code-text {
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .copy-success {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .copied-message {
            margin-top: 15px;
            padding: 10px 16px;
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copied-message.show {
            opacity: 1;
        }

        @media (max-width: 900px) {
            .wrapper {
                flex-direction: column;
                align-items: center;
            }

            .container {
                width: 100%;
                max-width: 600px;
            }

            h1 {
                font-size: 20px;
            }

            .code-text {
                font-size: 14px;
                letter-spacing: 1px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 18px;
            }

            .code-text {
                font-size: 13px;
                letter-spacing: 0.5px;
            }

            .btn {
                padding: 10px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 生成器一 -->
        <div class="container">
            <h1>一、七组随机码</h1>
            <div class="code-display">
                <div class="code-text" id="codeDisplay1"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-refresh" onclick="generateCode1()">
                    刷新生成
                </button>
                <button class="btn btn-copy" onclick="copyCode1()">
                    复制代码
                </button>
            </div>
            <div class="copied-message" id="copiedMessage1">已复制到剪贴板</div>
        </div>

        <!-- 生成器二 -->
        <div class="container">
            <h1>二、四组八位随机码</h1>
            <div class="code-display">
                <div class="code-text" id="codeDisplay2"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-refresh" onclick="generateCode2()">
                    刷新生成
                </button>
                <button class="btn btn-copy" onclick="copyCode2()">
                    复制代码
                </button>
            </div>
            <div class="copied-message" id="copiedMessage2">已复制到剪贴板</div>
        </div>

        <!-- 原有生成器三 -->
        <div class="container">
            <h1>三、混合格式随机码</h1>
            <div class="code-display">
                <div class="code-text" id="codeDisplay3"></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-refresh" onclick="generateCode3()">
                    刷新生成
                </button>
                <button class="btn btn-copy" onclick="copyCode3()">
                    复制代码
                </button>
            </div>
            <div class="copied-message" id="copiedMessage3">已复制到剪贴板</div>
        </div>
    </div>

    <script>
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const digits = '0123456789';

        function generateSegment(length, useChars = true) {
            const pool = useChars ? chars : digits;
            let result = '';
            for (let i = 0; i < length; i++) {
                result += pool[Math.floor(Math.random() * pool.length)];
            }
            return result;
        }

        // 生成器一：7组4位字母数字随机
        function generateCode1() {
            const parts = [];
            for (let i = 0; i < 7; i++) {
                parts.push(generateSegment(4));
            }
            const fullCode = parts.join('-');
            document.getElementById('codeDisplay1').textContent = fullCode;
        }

        async function copyCode1() {
            const code = document.getElementById('codeDisplay1').textContent;
            if (!code) {
                generateCode1();
                return;
            }
            try {
                await navigator.clipboard.writeText(code);
                const message = document.getElementById('copiedMessage1');
                message.classList.add('show');
                setTimeout(() => message.classList.remove('show'), 2000);
            } catch (err) {
                console.error('复制失败:', err);
            }
        }

        // 生成器二：4组8位字母数字随机
        function generateCode2() {
            const parts = [];
            for (let i = 0; i < 4; i++) {
                parts.push(generateSegment(8));
            }
            const fullCode = parts.join('-');
            document.getElementById('codeDisplay2').textContent = fullCode;
        }

        async function copyCode2() {
            const code = document.getElementById('codeDisplay2').textContent;
            if (!code) {
                generateCode2();
                return;
            }
            try {
                await navigator.clipboard.writeText(code);
                const message = document.getElementById('copiedMessage2');
                message.classList.add('show');
                setTimeout(() => message.classList.remove('show'), 2000);
            } catch (err) {
                console.error('复制失败:', err);
            }
        }

        // 原有生成器三：5组4位 + 8位数字 + 5位字母数字
        function generateCode3() {
            const parts = [];
            for (let i = 0; i < 5; i++) {
                parts.push(generateSegment(4));
            }
            const middle = generateSegment(8, false);
            const end = generateSegment(5);
            const fullCode = parts.join('-') + '/' + middle + '/' + end;
            document.getElementById('codeDisplay3').textContent = fullCode;
        }

        async function copyCode3() {
            const code = document.getElementById('codeDisplay3').textContent;
            if (!code) {
                generateCode3();
                return;
            }
            try {
                await navigator.clipboard.writeText(code);
                const message = document.getElementById('copiedMessage3');
                message.classList.add('show');
                setTimeout(() => message.classList.remove('show'), 2000);
            } catch (err) {
                console.error('复制失败:', err);
            }
        }

        // 初始化
        generateCode1();
        generateCode2();
        generateCode3();
    </script>
</body>
</html>
